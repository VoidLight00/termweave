name: Observe upstream candidates
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: termweave-upstream-watch
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Check watcher fixtures
        run: HERDR_TEST_MODE=unit bun test scripts/watch-upstreams.test.ts
      - name: Observe metadata only
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WATCH_RESTORE_GITHUB: '1'
          WATCH_STATE_BRANCH: upstream-watch-state
          GITHUB_REPOSITORY: ${{ github.repository }}
          WATCH_STATE_PATH: evidence/watcher/state.json
          WATCH_CANDIDATES_PATH: evidence/watcher/candidates.json
        run: bun scripts/watch-upstreams.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: upstream-observation
          path: evidence/watcher/
          retention-days: 90
      # Artifacts transfer this run's bounded result only; durable state lives in
      # the reviewed state branch, restored before every observation.

  candidates:
    needs: observe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: upstream-observation
          path: evidence/watcher/
      - name: Persist observations and idempotent candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WATCH_STATE_BRANCH: upstream-watch-state
          WATCH_ALLOW_WRITES: reviewed-ci
          WATCH_INPUT_PATH: evidence/watcher/input.json
        run: bun scripts/watch-publish.ts
