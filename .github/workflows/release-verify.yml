name: Verify immutable release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: HERDR_TEST_MODE=unit bun test scripts/release/release.test.ts scripts/release/build.test.ts
      - run: bun run typecheck
      # Native compatibility and exact-source product lanes must be approved and
      # recorded before buildRelease can produce a distributable artifact.
      # This job neither uploads a release nor activates any server.
