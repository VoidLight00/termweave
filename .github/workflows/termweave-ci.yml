name: TermWeave isolated verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: termweave-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Install locked dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install tmux (Ubuntu images ship it, macOS images do not)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Install pinned Chromium
        run: bun node_modules/playwright-core/cli.js install chromium
      - name: Verify source and synthetic browser lanes
        # no ledger lane: tracking/ is internal and left out of the public export (public-exclude.txt)
        run: bun scripts/verify-isolated.ts type build unit render source-style
      # Native API/integration lanes need a separately reviewed runtime binary lock.
      # No upstream installer, deployment action, credentials, or release workflow runs here.

  # Windows: the herdr/tmux terminal host is macOS/Linux only, so this lane checks what must
  # still work there: types, the web build, and the platform-neutral server stores.
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun run build
      - run: bun test ./server/workspace-colors.test.ts ./src/lib/sessionColor.test.ts ./src/lib/color.test.ts
