# GitHub Actions only. Bun, Node and herdr are pinned by hand in the workflows (herdr by
# checksum), and package bumps go through `bun install --frozen-lockfile` in a normal PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
